{% extends "base.html" %}

{% block title %}{% if cliente %}Editar{% else %}Nuevo{% endif %} Cliente - SISFAC{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-2 sm:px-0">
    <h2 class="text-2xl font-bold text-slate-800 mb-1">{% if cliente %}Editar{% else %}Nuevo{% endif %} Cliente</h2>
    <p class="text-sm text-slate-500 mb-4">Completa los datos del cliente</p>
    
    <div id="form-fragment" class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <form method="POST" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-slate-600 text-xs font-medium mb-0.5">Nombre *</label>
                    <input type="text" name="nombre" value="{{ cliente.nombre if cliente else '' }}" 
                           required 
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Nombre completo">
                </div>
                <div>
                    <label class="block text-slate-600 text-xs font-medium mb-0.5">CI</label>
                    <input type="text" name="ruc_ci" value="{{ cliente.ruc_ci if cliente else '' }}" 
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="12345678">
                </div>
            </div>
            <div class="flex gap-2 pt-0.5">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium">
                    Guardar
                </button>
                <a href="/clientes" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 text-sm font-medium">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
