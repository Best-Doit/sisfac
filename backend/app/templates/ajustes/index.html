{% extends "base.html" %}

{% block title %}Ajustes - SISFAC{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Ajustes</h2>
        <p class="text-sm text-gray-500 mt-0.5">Configuración del sistema y gestión de datos</p>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button type="button" onclick="openFormModal('/ajustes/modal/configuracion', 'Configuración del Sistema')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-blue-50 hover:border-blue-200 transition-colors text-left">
            <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-gray-800 text-sm">Configuración del Sistema</span>
                <p class="text-xs text-gray-500 mt-0.5">Umbral de stock bajo</p>
            </div>
        </button>

        <button type="button" onclick="openFormModal('/ajustes/modal/backup', 'Copias de Seguridad')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-purple-50 hover:border-purple-200 transition-colors text-left">
            <div class="w-10 h-10 rounded-lg bg-purple-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-gray-800 text-sm">Copias de Seguridad</span>
                <p class="text-xs text-gray-500 mt-0.5">Crear, restaurar o descargar backups</p>
            </div>
        </button>

        <button type="button" onclick="openFormModal('/ajustes/modal/restaurar', 'Restaurar Backup')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-green-50 hover:border-green-200 transition-colors text-left">
            <div class="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-gray-800 text-sm">Restaurar Backup</span>
                <p class="text-xs text-gray-500 mt-0.5">Restaurar desde un archivo .db</p>
            </div>
        </button>

        <button type="button" onclick="openFormModal('/ajustes/modal/exportar', 'Exportar a Excel')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-green-50 hover:border-green-200 transition-colors text-left">
            <div class="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-gray-800 text-sm">Exportar a Excel</span>
                <p class="text-xs text-gray-500 mt-0.5">Exportar clientes, productos y facturas</p>
            </div>
        </button>

        <button type="button" onclick="openFormModal('/ajustes/modal/importar', 'Importar Excel')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-emerald-50 hover:border-emerald-200 transition-colors text-left">
            <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-gray-800 text-sm">Importar Excel</span>
                <p class="text-xs text-gray-500 mt-0.5">Importar datos desde un Excel exportado</p>
            </div>
        </button>

        <button type="button" onclick="openFormModal('/ajustes/modal/borrar-datos', 'Zona Peligrosa')"
                class="flex items-center gap-3 p-4 bg-white rounded-xl shadow-sm border-l-4 border-red-400 hover:bg-red-50 transition-colors text-left sm:col-span-2">
            <div class="w-10 h-10 rounded-lg bg-red-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <div>
                <span class="font-semibold text-red-700 text-sm">Zona Peligrosa</span>
                <p class="text-xs text-red-500 mt-0.5">Borrar todos los datos del sistema</p>
            </div>
        </button>
    </div>
</div>
{% endblock %}
