{% extends "base.html" %}
{% block title %}Restaurar Backup - SISFAC{% endblock %}
{% block content %}
<div id="form-fragment" class="p-0">
    <p class="text-sm text-gray-600 mb-3">Seleccione un archivo .db de backup. La base de datos actual será reemplazada. Se creará un backup automático antes.</p>
    <form method="POST" action="/ajustes/restaurar" enctype="multipart/form-data"
          x-data="{ loading: false }"
          @submit.prevent="loading = true; const fd = new FormData($event.target); fetch('/ajustes/restaurar', { method: 'POST', body: fd }).then(r => r.json()).then(data => { loading = false; if(data.success) { window.notify(data.message, 'success'); document.getElementById('form-modal-overlay').style.display = 'none'; setTimeout(() => location.reload(), 1500); } else { window.notify('Error: ' + data.message, 'error'); } }).catch(err => { loading = false; window.notify('Error: ' + err.message, 'error'); });">
        <div class="mb-3">
            <input type="file" name="archivo" accept=".db" required
                   class="block w-full text-sm text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>
        <div class="flex gap-2">
            <button type="submit" :disabled="loading"
                    class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium text-sm disabled:opacity-50">
                <span x-show="!loading">Restaurar Backup</span>
                <span x-show="loading">Restaurando...</span>
            </button>
            <button type="button" onclick="document.getElementById('form-modal-overlay').style.display='none'"
                    class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium text-sm">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}
