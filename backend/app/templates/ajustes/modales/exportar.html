{% extends "base.html" %}
{% block title %}Exportar a Excel - SISFAC{% endblock %}
{% block content %}
<div id="form-fragment" class="p-0">
    <p class="text-sm text-gray-600 mb-3">Exporta clientes, productos, facturas y talonarios a un archivo Excel.</p>
    <div class="flex gap-2 flex-wrap">
        <a href="/ajustes/exportar-datos" target="_blank"
           class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium text-sm">
            Exportar a Excel
        </a>
        <button type="button" onclick="document.getElementById('form-modal-overlay').style.display='none'"
                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium text-sm">Cerrar</button>
    </div>
</div>
{% endblock %}
