{% extends "base.html" %}
{% block title %}Configuración - SISFAC{% endblock %}
{% block content %}
<div id="form-fragment" class="p-0">
    <p class="text-sm text-gray-600 mb-3">Ajuste el umbral de stock bajo. Los productos con stock menor se marcarán en rojo.</p>
    <form method="POST" action="/ajustes/configuracion"
          x-data="{ loading: false }"
          @submit.prevent="loading = true; fetch('/ajustes/configuracion', { method: 'POST', body: new FormData($event.target) }).then(r => r.json()).then(data => { loading = false; if(data.success) { window.notify(data.message, 'success'); if(window.closeModal) document.getElementById('form-modal-overlay').style.display = 'none'; } else { window.notify('Error: ' + data.message, 'error'); } }).catch(err => { loading = false; window.notify('Error: ' + err.message, 'error'); });">
        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Umbral de Stock Bajo</label>
            <input type="number" name="umbral_stock" value="{{ umbral_stock }}" min="1" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="flex gap-2">
            <button type="submit" :disabled="loading"
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium text-sm disabled:opacity-50">
                <span x-show="!loading">Guardar</span>
                <span x-show="loading">Guardando...</span>
            </button>
            <button type="button" onclick="document.getElementById('form-modal-overlay').style.display='none'"
                    class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium text-sm">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}
