{% extends "base.html" %}
{% block title %}Borrar todos los datos - SISFAC{% endblock %}
{% block content %}
<div id="form-fragment" class="p-0">
    <p class="text-sm text-red-700 font-medium mb-2">Esta acción borrará TODOS los datos del sistema. Se creará un backup automático antes.</p>
    <form method="POST" action="{{ url_for('ajustes.borrar_datos') }}"
          x-data="{}"
          @submit.prevent="if($event.target.confirmacion.value.trim().toLowerCase() !== 'borrar') { window.notify('Escribe BORRAR para confirmar', 'error'); return; } if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return; fetch('{{ url_for('ajustes.borrar_datos') }}', { method: 'POST', body: new FormData($event.target), headers: { 'X-Requested-With': 'XMLHttpRequest' } }).then(r => { if(!r.ok) throw new Error('Error del servidor (' + r.status + ')'); return r.json(); }).then(data => { if(data.success) { window.notify(data.message, 'success'); document.getElementById('form-modal-overlay').style.display = 'none'; setTimeout(() => location.reload(), 1500); } else { window.notify('Error: ' + data.message, 'error'); } }).catch(err => { window.notify('Error: ' + err.message, 'error'); });">
        <div class="mb-3">
            <label class="block text-sm font-medium text-red-700 mb-1">Escribe <span class="font-mono bg-red-50 px-1 rounded">BORRAR</span> para confirmar:</label>
            <input type="text" name="confirmacion" placeholder="BORRAR"
                   class="w-full px-3 py-2 border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 text-sm">
        </div>
        <div class="flex gap-2">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium text-sm">Borrar todos los datos</button>
            <button type="button" onclick="document.getElementById('form-modal-overlay').style.display='none'"
                    class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 font-medium text-sm">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}
